name: Build & Test

# ============================================================================
# OPTION A — GitHub-hosted macOS runner (consumes GitHub macOS minutes).
# Scaffolded alongside OPTION B (codemagic.pr.yaml). Ship ONLY ONE of the two.
# Pick A if you want the check on GitHub's runners; pick B to reuse the
# existing Codemagic mac and spend no GitHub macOS minutes.
# ============================================================================
#
# Runs the unit tests on a tvOS Simulator: build-for-testing then
# test-without-building (so a compile failure and a test failure are distinct
# signals). Full signed archive/TestFlight stays on Codemagic (tag builds).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # macos-26 carries Xcode 26 / the tvOS 26 SDK this app requires. If that
    # image label is not yet available, use the newest macos-* image that ships
    # Xcode 26 and select it below with `xcode-select`.
    runs-on: macos-26
    env:
      SCHEME: Rivulet
      PROJECT: Rivulet.xcodeproj
      DESTINATION: 'platform=tvOS Simulator,name=Apple TV,OS=latest'
      SPM_CACHE: .spm-cache
    steps:
      - uses: actions/checkout@v4

      # AetherEngine + transitive deps are the slow part; cache the resolved
      # SwiftPM checkout keyed on the pins.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ${{ env.SPM_CACHE }}
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', '**/*.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Install xcbeautify
        run: brew install xcbeautify

      # Secrets.swift is gitignored and generated in CI (see codemagic.yaml).
      # A stub with an empty DSN is enough to compile and test.
      - name: Generate Secrets.swift stub
        run: |
          mkdir -p Rivulet/Config
          cat > Rivulet/Config/Secrets.swift <<'EOF'
          import Foundation

          enum Secrets {
              static let sentryDSN = ""
          }
          EOF

      # Rivulet.xctestplan is created by another track. Use it when present;
      # otherwise fall back to the scheme's default test action so this job is
      # green before that file lands.
      - name: Resolve test plan flag
        id: plan
        run: |
          if find . -name 'Rivulet.xctestplan' -print -quit | grep -q .; then
            echo "flag=-testPlan Rivulet" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "Rivulet.xctestplan not found — using scheme default."
          fi

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -scheme "$SCHEME" \
            -project "$PROJECT" \
            -destination "$DESTINATION" \
            -clonedSourcePackagesDirPath "$SPM_CACHE" \
            ${{ steps.plan.outputs.flag }} \
            | xcbeautify

      - name: Test without building
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -scheme "$SCHEME" \
            -project "$PROJECT" \
            -destination "$DESTINATION" \
            -clonedSourcePackagesDirPath "$SPM_CACHE" \
            ${{ steps.plan.outputs.flag }} \
            | xcbeautify

      # Alternative once the Makefile track lands (targets: bootstrap/lint/
      # format/test/build). Keep the direct xcodebuild path above as the
      # fallback until the Makefile is on main.
      #   - name: Test via make
      #     run: make test
