# ============================================================================
# OPTION B — Codemagic PR validation (reuses the existing Codemagic mac; spends
# NO GitHub macOS minutes). Scaffolded alongside OPTION A
# (.github/workflows/build-test.yml). Ship ONLY ONE of the two.
#
# This lives in a SEPARATE file on purpose: the primary codemagic.yaml is the
# tag → TestFlight pipeline and must not change. Codemagic reads codemagic.yaml,
# so this block is inert until you either move it into codemagic.yaml or point a
# Codemagic app at this file. Env/scheme conventions mirror codemagic.yaml.
# ============================================================================
workflows:
  rivulet-tvos-pr-validation:
    name: Rivulet tvOS PR validation
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - rivulet
      vars:
        XCODE_SCHEME: "Rivulet"
        XCODE_PROJECT: "Rivulet.xcodeproj"
        # tvOS 26 simulator; `name` is resolved by Codemagic's installed runtimes.
        TEST_DESTINATION: "platform=tvOS Simulator,name=Apple TV,OS=latest"
      xcode: latest

    triggering:
      events:
        - pull_request
      cancel_previous_builds: true

    scripts:
      # Secrets.swift is gitignored and generated in CI (see codemagic.yaml).
      # A stub with an empty DSN compiles and tests fine — no real secret needed.
      - name: Generate Secrets.swift stub
        script: |
          mkdir -p Rivulet/Config
          cat > Rivulet/Config/Secrets.swift <<'EOF'
          import Foundation

          enum Secrets {
              static let sentryDSN = ""
          }
          EOF

      # Rivulet.xctestplan is created by another track. Use it when present;
      # otherwise fall back to the scheme's default test action.
      - name: Build for testing
        script: |
          set -o pipefail
          PLAN_FLAG=""
          if find . -name 'Rivulet.xctestplan' -print -quit | grep -q .; then
            PLAN_FLAG="-testPlan Rivulet"
          fi
          xcodebuild build-for-testing \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "$TEST_DESTINATION" \
            $PLAN_FLAG \
            | xcbeautify

      - name: Test without building
        script: |
          set -o pipefail
          PLAN_FLAG=""
          if find . -name 'Rivulet.xctestplan' -print -quit | grep -q .; then
            PLAN_FLAG="-testPlan Rivulet"
          fi
          xcodebuild test-without-building \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "$TEST_DESTINATION" \
            $PLAN_FLAG \
            | xcbeautify

    artifacts:
      - /tmp/xcodebuild_logs/*.log
