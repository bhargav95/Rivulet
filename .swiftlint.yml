# SwiftLint configuration for Rivulet.
#
# Philosophy: keep the rules that catch real bugs, drop the pure-style noise
# that fights the codebase's existing conventions (SwiftFormat owns formatting).
# Pre-existing violations are grandfathered via .swiftlint-baseline.json, so a
# clean checkout passes and only NEW violations fail. Regenerate the baseline
# after a deliberate cleanup:
#   swiftlint lint --write-baseline .swiftlint-baseline.json

excluded:
  - .build
  - DerivedData
  - Rivulet/OpenSourceLicenses.swift   # generated
  - Rivulet/Config/Secrets.swift        # generated in CI
  - RivuletTests/Fixtures
  - node_modules
  - .wrangler

baseline: .swiftlint-baseline.json

disabled_rules:
  # Pure style — no correctness signal, conflicts with the codebase's conventions.
  - identifier_name
  - line_length
  - trailing_comma
  - todo
  - nesting
  - large_tuple

  # Size metrics — real, but not "noise". Track separately, don't gate on them.
  - function_body_length
  - file_length
  - type_body_length
  - cyclomatic_complexity
  - function_parameter_count

  # Formatting SwiftFormat handles deterministically — no need to double-report.
  - vertical_whitespace
  - statement_position
  - comma
  - opening_brace
  - colon
  - trailing_whitespace
  - trailing_newline
  - comment_spacing
  - closure_parameter_position
  - vertical_parameter_alignment
  - implicit_optional_initialization

# Kept on (bug / smell catchers), for reference:
#   force_cast, force_try, non_optional_string_data_conversion, for_where,
#   unused_closure_parameter, unused_optional_binding, redundant_string_enum_value,
#   void_function_in_ternary, control_statement, unneeded_override, inclusive_language, …

# Custom rules encode CLAUDE.md invariants that were previously reviewer-memory
# only. `match_kinds` restricts matches to real code tokens so the rules never
# fire on the comments that document these very invariants. Verified zero hits
# on the current tree (custom rules are NOT covered by the baseline).
custom_rules:
  no_uikit_context_menu:
    name: "No UIContextMenuInteraction on tvOS"
    # tvOS 26 never asks a UIKit context-menu interaction for its configuration
    # (verified, see TileMenuPopupViewController). The canonical menu is the
    # hand-built TileMenuPopupViewController fed by a UILongPressGestureRecognizer.
    regex: '\b(UIContextMenuInteraction|contextMenuConfigurationForItemsAt)\b'
    match_kinds: [identifier, typeidentifier]
    message: "UIKit context menus are dead on tvOS 26 — use TileMenuPopupViewController (see CLAUDE.md)."
    severity: error

  no_swiftui_in_uikit_surface:
    name: "No SwiftUI in UIKit primary surfaces"
    # Home/Detail/Library/Person/PreviewCarousel/player-chrome are UIKit by
    # default (CLAUDE.md). Settings/Music/nav shells stay SwiftUI and are not
    # matched here. PlexHomeViewController is a grandfathered leftover import.
    regex: '\bimport\s+SwiftUI\b'
    match_kinds: [keyword, identifier, typeidentifier]
    included: 'Rivulet/Views/(Media/(UIKit|Library/UIKit|MediaDetail/UIKit|Person/UIKit|PlexHome/UIKit|PreviewCarousel/UIKit)|Player/UIKit)/[^/]+\.swift$'
    excluded: '.*PlexHomeViewController\.swift$'
    message: "UIKit is the default on this surface — do not add SwiftUI (see CLAUDE.md)."
    severity: error

  no_avplayerlayer_on_current_avplayer:
    name: "No AVPlayerLayer on currentAVPlayer"
    # Video renders through the engine surface (AetherVideoSurfaceView →
    # engine.bind(view:)), never a raw AVPlayerLayer bound to currentAVPlayer.
    # Conservative: only the AVPlayerLayer(...currentAVPlayer...) construction.
    regex: 'AVPlayerLayer\([^)\n]*currentAVPlayer'
    message: "Render video through the engine surface, not an AVPlayerLayer on currentAVPlayer (see CLAUDE.md / RIVULET_PLAYER.md)."
    severity: error
